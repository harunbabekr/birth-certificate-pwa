<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لا يوجد اتصال بالإنترنت</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, Arial, sans-serif;
      background-color: #f1f5f9;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      color: #1e293b;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
      color: #0f172a;
    }
    p {
      line-height: 1.7;
      color: #64748b;
      margin: 0 0 24px;
      font-size: 0.95rem;
    }
    button {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>أنت الآن في وضع عدم الاتصال</h1>
    <p>لا يوجد اتصال بالإنترنت حالياً. إذا قمت بتقديم طلب أو رفع إيصال، فقد تم حفظه محلياً في هاتفك وسيقوم النظام بإرساله تلقائياً فور عودة الشبكة.</p>
    <button onclick="window.location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
